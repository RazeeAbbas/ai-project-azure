apiVersion: v1
kind: Namespace
metadata:
  name: ai-knowledge-copilot
---
apiVersion: v1
kind: Service
metadata:
  name: ai-knowledge-copilot-backend
  namespace: ai-knowledge-copilot
  labels:
    app: ai-knowledge-copilot
    component: backend
spec:
  type: ClusterIP
  selector:
    app: ai-knowledge-copilot
    component: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-knowledge-copilot-frontend
  namespace: ai-knowledge-copilot
  labels:
    app: ai-knowledge-copilot
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-knowledge-copilot
      component: frontend
  template:
    metadata:
      labels:
        app: ai-knowledge-copilot
        component: frontend
    spec:
      containers:
        - name: frontend
          image: aicopdevz4ep7yacr.azurecr.io/ai-knowledge-copilot-frontend:20261023-2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 128m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: ai-knowledge-copilot-frontend
  namespace: ai-knowledge-copilot
  labels:
    app: ai-knowledge-copilot
    component: frontend
spec:
  type: LoadBalancer
  selector:
    app: ai-knowledge-copilot
    component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP