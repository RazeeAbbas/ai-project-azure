# ------------------------------------------ #
# AI Knowledge Copilot - GitHub Actions CI/CD  #
# Full pipeline: test → build → scan → deploy  #
# ------------------------------------------ #

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID:        ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID:        ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_CLIENT_SECRET:    ${{ secrets.AZURE_CLIENT_SECRET }}

  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_BACKEND:    ai-knowledge-copilot-backend
  IMAGE_FRONTEND:   ai-knowledge-copilot-frontend

  AKS_CLUSTER:      ${{ secrets.AKS_CLUSTER_NAME }}
  RESOURCE_GROUP:   ${{ secrets.AKS_RESOURCE_GROUP }}

  APP_SERVICE_NAME: ${{ secrets.APP_SERVICE_NAME }}

jobs:
  # ─────────────────────────────────────────
  # 1. Lint & Test Backend
  # ─────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run linting (flake8)
        run: |
          pip install flake8
          flake8 src --max-line-length=120 --ignore=E501,W503,E402 || true

      - name: Run backend tests
        env:
          AZURE_OPENAI_ENDPOINT: "https://placeholder.openai.azure.com/"
          AZURE_OPENAI_API_KEY: "placeholder"
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          AZURE_SEARCH_ENDPOINT: "https://placeholder.search.windows.net"
          AZURE_SEARCH_KEY: "placeholder"
        run: |
          pytest tests/ -v --tb=short || true

  # ─────────────────────────────────────────
  # 2. Lint & Test Frontend
  # ─────────────────────────────────────────
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit || true

      - name: Run frontend tests
        run: npm test || true

  # ─────────────────────────────────────────
  # 3. Terraform Plan (on PRs)
  # ─────────────────────────────────────────
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5.7'

      - name: Azure login for Terraform
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../../..

      - name: Terraform Init
        run: terraform init -backend=false
        env:
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var="db_admin_password=${{ secrets.DB_ADMIN_PASSWORD }}" -no-color
        env:
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}

  # ─────────────────────────────────────────
  # 4. Build & Push Docker Images
  # ─────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name != 'pull_request'

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | head -c 8)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.tag }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_FRONTEND }}:${{ steps.meta.outputs.tag }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_FRONTEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────
  # 5. Security Scan
  # ─────────────────────────────────────────
  security-scan:
    name: Image Security Scan
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Pull backend image for scanning
        run: docker pull ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_BACKEND }}:${{ needs.build-and-push.outputs.image_tag }}

      - name: Trivy - Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_BACKEND }}:${{ needs.build-and-push.outputs.image_tag }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Pull frontend image for scanning
        run: docker pull ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_FRONTEND }}:${{ needs.build-and-push.outputs.image_tag }}

      - name: Trivy - Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_FRONTEND }}:${{ needs.build-and-push.outputs.image_tag }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # ─────────────────────────────────────────
  # 6. Deploy to AKS (dev/develop branch)
  # ─────────────────────────────────────────
  deploy-aks-dev:
    name: Deploy to AKS (Dev)
    runs-on: ubuntu-latest
    needs: [build-and-push, security-scan]
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER }} \
            --overwrite-existing

      - name: Set image tag in manifests
        run: |
          IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
          sed -i "s|:latest|:${IMAGE_TAG}|g" kubernetes/deployment.yaml

      - name: Apply Kubernetes manifests
        run: kubectl apply -f kubernetes/

      - name: Update backend image
        run: |
          kubectl set image deployment/ai-knowledge-copilot-backend \
            backend=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_BACKEND }}:${{ needs.build-and-push.outputs.image_tag }} \
            -n ai-knowledge-copilot

      - name: Update frontend image
        run: |
          kubectl set image deployment/ai-knowledge-copilot-frontend \
            frontend=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_FRONTEND }}:${{ needs.build-and-push.outputs.image_tag }} \
            -n ai-knowledge-copilot

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/ai-knowledge-copilot-backend -n ai-knowledge-copilot --timeout=5m
          kubectl rollout status deployment/ai-knowledge-copilot-frontend -n ai-knowledge-copilot --timeout=5m

      - name: Smoke test
        run: |
          BACKEND_IP=$(kubectl get svc ai-knowledge-copilot-backend -n ai-knowledge-copilot -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "pending")
          echo "Backend IP: ${BACKEND_IP}"
          if [ "$BACKEND_IP" != "pending" ] && [ -n "$BACKEND_IP" ]; then
            curl -sf http://${BACKEND_IP}:8000/health || echo "Health check failed (may still be starting)"
          else
            echo "Service IP not yet assigned — smoke test skipped"
          fi

  # ─────────────────────────────────────────
  # 7. Deploy to App Service (dev)
  # ─────────────────────────────────────────
  deploy-appservice-dev:
    name: Deploy to App Service (Dev)
    runs-on: ubuntu-latest
    needs: [build-and-push, security-scan]
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Deploy backend to App Service
        run: |
          az webapp config container set \
            --name ${{ env.APP_SERVICE_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --container-image-name ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_BACKEND }}:${{ needs.build-and-push.outputs.image_tag }} \
            --container-registry-url https://${{ env.ACR_LOGIN_SERVER }} \
            --container-registry-user ${{ secrets.AZURE_CLIENT_ID }} \
            --container-registry-password ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Wait for App Service restart
        run: sleep 30

      - name: Smoke test App Service
        run: |
          APPURL=$(az webapp show --name ${{ env.APP_SERVICE_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query defaultHostName -o tsv)
          curl -sf "https://${APPURL}/health" || echo "App Service health check returned non-200 (may be warming up)"

  # ─────────────────────────────────────────
  # 8. Production Deploy (main branch, with approval)
  # ─────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: production
      url: https://${{ secrets.APP_SERVICE_NAME_PROD }}.azurewebsites.net

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Deploy to Production AKS
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.AKS_RESOURCE_GROUP_PROD }} \
            --name ${{ secrets.AKS_CLUSTER_NAME_PROD }} \
            --overwrite-existing

          kubectl set image deployment/ai-knowledge-copilot-backend \
            backend=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_BACKEND }}:${{ needs.build-and-push.outputs.image_tag }} \
            -n ai-knowledge-copilot

          kubectl set image deployment/ai-knowledge-copilot-frontend \
            frontend=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_FRONTEND }}:${{ needs.build-and-push.outputs.image_tag }} \
            -n ai-knowledge-copilot

          kubectl rollout status deployment/ai-knowledge-copilot-backend -n ai-knowledge-copilot --timeout=10m
          kubectl rollout status deployment/ai-knowledge-copilot-frontend -n ai-knowledge-copilot --timeout=10m

      - name: Deployment summary
        run: |
          echo "✅ Deployed image tag: ${{ needs.build-and-push.outputs.image_tag }}"
          echo "✅ Commit: ${{ github.sha }}"
          echo "✅ Actor: ${{ github.actor }}"
